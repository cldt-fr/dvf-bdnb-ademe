[project]
name = "dvf-bdnb-ademe"
version = "0.1.0"
description = "DVF, BDNB et DPE nettoyes, partitionnes et republies a chaque millesime"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=25.0.1",
    "typer>=0.12",
]

[project.scripts]
dvf-bdnb = "dvf_bdnb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvf_bdnb"]

# Le registre des sources est livré AVEC le code : sans cela, l'outil fonctionne
# depuis le dépôt et échoue une fois installé.
artifacts = ["src/dvf_bdnb/sources.toml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
